[project]
name = "test-tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.36.2",
    "transformers>=4.51.3,<5.0.0",
    "datasets==3.5.0",
    "accelerate==1.6.0",
    "llvmlite>=0.40.0",
    "numba>=0.57.0",
    "diffusers",
    "tqdm",
    "numpy",
    "scipy",
    "librosa",
    "ml-collections",
    "absl-py",
    "gradio",
    "av",
    "aiortc",
    "uvicorn[standard]",
    "fastapi",
    "pydub",
    "requests",
    "torch>=2.10.0",
    "bitsandbytes>=0.49.2",
    "setuptools>=82.0.0",
    "wandb>=0.25.0",
    "fiftyone>=1.13.1",
    "edge-tts>=7.2.8",
]

[project.optional-dependencies]
streamingtts = [
  "transformers==4.51.3", 
]

# Use the CUDA 13.0 PyTorch build on Linux (required for NVIDIA GB10 / DGX Spark, aarch64, sm_121).
# Without this, a CPU-only torch wheel can end up installed and training silently runs on CPU.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

